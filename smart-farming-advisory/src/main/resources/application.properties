spring.application.name=Smart Farming Advisory System

# Railway compatible port
server.port=${PORT:8080}

# View resolver
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.html

# Groq API Configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=groq/compound-mini

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Custom sender name
app.mail.display-name=Smart Farming Advisory Team <your-actual-email@gmail.com>

# Session
server.servlet.session.timeout=30m
spring.session.store-type=none

# Logging
logging.level.root=INFO
logging.level.com.farming=DEBUG

# Profile (Railway / local safe)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
