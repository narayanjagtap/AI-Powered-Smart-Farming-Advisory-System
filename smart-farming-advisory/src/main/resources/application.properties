spring.application.name=Smart Farming Advisory System

server.port=${PORT:8080}

# View resolver
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.html

groq.api.key=HIDDEN_API_KEY_FOR_DEMO
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=groq/compound-mini

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# CHANGED: Sensitive credentials removed
spring.mail.username=admin_placeholder@gmail.com
spring.mail.password=password_hidden_for_security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.display-name=Smart Farming Advisory Team <noreply@smartfarming-demo.com>

# Session
server.servlet.session.timeout=30m
spring.session.store-type=none

# Logging
logging.level.root=INFO
logging.level.com.farming=INFO

# Profile
spring.profiles.active=prod
